version: '3.8'

services:
  backend:
    build: ./backend
    container_name: clinical-analyzer-backend
    ports:
      - "8000:8000"
    environment:
      - LANGEXTRACT_API_KEY=${LANGEXTRACT_API_KEY}
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - clinical-network

  frontend:
    build: ./frontend
    container_name: clinical-analyzer-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CI=false
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - clinical-network
    stdin_open: true
    tty: true

networks:
  clinical-network:
    driver: bridge
